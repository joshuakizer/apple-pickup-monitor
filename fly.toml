# Background worker: no HTTP service.
app = "iphone-nyc-monitor"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  # Tuned for a 1 GB proxy budget over ~4 days: one ZIP, every 30s
  # from 8 to 22 Eastern time and every 10 min at night.
  INTERVAL = "30"
  NIGHT_INTERVAL = "600"
  ACTIVE_HOURS = "8-22"
  CAPACITIES = "ALL"
  LOCATIONS = "33579"
  STORES = "ALL"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[[restart]]
  policy = "always"
