name: Apple Inventory Monitor

on:
  workflow_dispatch:

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Apple inventory
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          LOCATIONS: "33579,33602,33511"
          STORES: "ALL"
          STORE_TZ: "America/New_York"
        run: python3 monitor.py --once